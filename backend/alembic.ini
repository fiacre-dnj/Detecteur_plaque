; Configuration Alembic.
;
; L'URL de la base n'est PAS écrite ici : elle vient de `Settings`, comme tout le
; reste. `migrations/env.py` la lit — sinon on aurait deux sources de vérité, et
; c'est toujours la mauvaise qu'on modifie.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# Une migration par changement, préfixée de la date pour que l'ordre de lecture
# du répertoire corresponde à l'ordre chronologique.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
