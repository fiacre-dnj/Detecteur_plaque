[project]
name = "traffic-analysis"
version = "0.1.0"
description = "Comptage de véhicules par vision : détection, suivi, ré-identification, ANPR."
readme = "../README.md"
license = { text = "AGPL-3.0-or-later" }
# La borne haute est volontaire : voir docs/adr/0001-python-312.md.
# Sans elle, le mode de défaillance est « plante à l'import de torch » après
# plusieurs minutes d'installation, au lieu de « uv refuse de résoudre ».
requires-python = ">=3.12,<3.13"

dependencies = [
    # ── Transport ────────────────────────────────────────────────────────────
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # ── Configuration et validation ──────────────────────────────────────────
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # ── Vision ───────────────────────────────────────────────────────────────
    "ultralytics>=8.4,<9",
    # torch est déclaré explicitement bien qu'ultralytics le tire : c'est ce qui
    # permet à `tool.uv.torch-backend` de choisir la variante (voir plus bas).
    "torch>=2.4",
    "torchvision>=0.19",
    # `lap` n'est PAS optionnelle. Ultralytics ne la tire pas, mais BoT-SORT et
    # ByteTrack en ont besoin pour l'assignation linéaire : sans elle,
    # model.track() échoue à l'exécution avec « No module named 'lap' » — et
    # aucun test à moteur factice ne peut le voir.
    "lap>=0.5",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    # `onnx` en plus d'`onnxruntime` : Ultralytics l'exige pour **lire** un
    # `.onnx` (le modèle de plaques), et va jusqu'à l'installer lui-même au
    # premier appel s'il manque. Deux minutes de téléchargement au milieu de la
    # première analyse ANPR, et un échec pur et simple dans un conteneur sans
    # réseau — deux raisons de le déclarer ici plutôt que de le subir.
    "onnx>=1.16",
    # ── Persistance ──────────────────────────────────────────────────────────
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    # ── Observabilité et bornes ──────────────────────────────────────────────
    "structlog>=24",
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6",
    "asgi-lifespan>=2.1.0",
]

# ─── Résolution de torch ─────────────────────────────────────────────────────
[tool.uv]
# uv choisit la variante de torch d'après le matériel de la machine qui
# installe : roue CPU (~250 Mo) ici, roue CUDA correspondant au pilote détecté
# sur une machine NVIDIA. Aucune ligne de code ne dépend de ce choix, et le
# lockfile porte les deux univers — donc pas d'extra à penser, et pas 2,3 Go de
# CUDA jamais exécutés sur un poste sans GPU.
#
# Pour forcer une variante :  UV_TORCH_BACKEND=cu124 uv sync
#
# Voir docs/adr/0005-torch-cpu-par-defaut.md.
torch-backend = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traffic_analysis"]

# ─── Ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F",      # pycodestyle, pyflakes
    "I",           # isort
    "UP",          # pyupgrade
    "B",           # bugbear
    "SIM",         # simplify
    "C4",          # comprehensions
    "RUF",
    "ANN",         # annotations obligatoires
    "ASYNC",
    "S",           # bandit : assert en production, chemins temporaires, subprocess
    "T20",         # aucun print
    "PTH",         # pathlib plutôt qu'os.path
    "RET",
    "ARG",         # arguments inutilisés
]
ignore = [
    # Les apostrophes typographiques et les guillemets « » du français sont du
    # texte voulu, pas des homoglyphes accidentels.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# S101 : `assert` est le vocabulaire de pytest.
# ANN201 : le type de retour d'un test n'apporte rien.
# ARG001 : une fixture injectée pour son effet de bord n'est pas utilisée.
# ASYNC110 : la règle conseille `asyncio.Event` plutôt qu'une boucle de sondage.
#   Elle a raison en production — et tort ici : plusieurs tests *simulent* le
#   client réel, qui double le flux SSE d'un sondage lent. Remplacer la boucle par
#   un événement testerait un chemin que le navigateur n'emprunte jamais.
"tests/**" = ["S101", "ANN201", "ARG001", "ASYNC110"]
"migrations/**" = ["ANN", "INP001"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.format]
quote-style = "double"

# ─── mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Seule tolérance : les adaptateurs parlent à des bibliothèques non typées
# (ultralytics, cv2). Le domaine et l'application restent strictement typés —
# c'est là qu'est la logique.
module = "traffic_analysis.features.*.infrastructure.*"
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["ultralytics.*", "cv2.*", "lap.*", "slowapi.*", "onnxruntime.*"]
ignore_missing_imports = true

# ─── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
# La roue `ultralytics` embarque son propre paquet `tests` : sans ces deux
# lignes, `from tests.support…` peut résoudre vers SES fichiers, pas les nôtres.
consider_namespace_packages = false
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error", "ignore::DeprecationWarning:pkg_resources.*"]

[tool.coverage.run]
source = ["src/traffic_analysis"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
